name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Core unit tests
        run: npm test -w @remo/core
      - name: Node transport, bridge and desktop shell tests
        run: |
          npm test -w @remo/node-transport
          npm test -w @remo/bridge
          npm test -w @remo/desktop
      - name: Type check
        run: npm run typecheck
      - name: Build web app
        run: npm run build:web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (web, desktop + mobile viewports)
        run: npm run e2e -w @remo/web
      - uses: actions/upload-artifact@v7
        with:
          name: remo-web
          path: apps/web/dist
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  windows:
    name: Windows app
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Electron end-to-end test
        run: npm run e2e -w @remo/desktop
      - name: Build installer (NSIS x64/arm64) and portable exe
        run: npm run dist:win -w @remo/desktop
        env:
          # Optional code signing: add CSC_LINK (base64 .pfx) and CSC_KEY_PASSWORD secrets.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: remo-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          retention-days: 14

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:web
      - name: Sync web app into the Android project
        run: npx cap sync android
        working-directory: apps/mobile
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/remo.keystore"
          echo "REMO_KEYSTORE_PATH=$RUNNER_TEMP/remo.keystore" >> "$GITHUB_ENV"
      - name: Build APKs and app bundle
        working-directory: apps/mobile/android
        env:
          REMO_VERSION_CODE: ${{ github.run_number }}
          REMO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REMO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REMO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease lint
      - name: Collect outputs
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk out/Remo-debug.apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/Remo.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab out/Remo.aab
      - uses: actions/upload-artifact@v7
        with:
          name: remo-android
          path: out/*
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint
          path: apps/mobile/android/app/build/reports/lint-results-*.html
          retention-days: 7

  docker:
    name: Bridge Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t remo-bridge .
      - name: Smoke test
        run: |
          docker run -d --name remo -p 8732:8732 remo-bridge
          for i in $(seq 1 20); do curl -fsS http://localhost:8732/api/health && break; sleep 1; done
          curl -fsS http://localhost:8732/ | grep -q '<div id="root">'
          docker rm -f remo
