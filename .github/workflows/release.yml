name: Release

# Push a tag like v1.0.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package web app and bridge
        run: |
          cd artifacts/remo-web && zip -qr ../../Remo-web.zip . && cd ../..
          ls -R artifacts | head -50
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Remo-web.zip
            artifacts/remo-windows/*.exe
            artifacts/remo-android/Remo.apk
            artifacts/remo-android/Remo.aab
