name: Release

# Builds every platform and publishes a GitHub release with the Windows, Android and web builds.
# Either push a tag like v1.0.0, or run this workflow manually (Actions → Release → Run workflow)
# and enter the version: the tag is then created on the selected commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 (got '$VERSION')"; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package web app
        run: |
          cd artifacts/remo-web && zip -qr ../../Remo-web.zip . && cd ../..
          ls -R artifacts | head -50
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Remo ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Remo-web.zip
            artifacts/remo-windows/*.exe
            artifacts/remo-android/Remo.apk
            artifacts/remo-android/Remo.aab
